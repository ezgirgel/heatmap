# ============================================================================
# heatmap.conf — конфигурация heatmap (GIF-карты перемещений игроков)
#
# Формат: KEY="value" (bash-sourceable).
# Все пути абсолютные либо с использованием ${SCRIPT_DIR} — каталог, в котором
# лежит сам скрипт (экспортируется до source этого файла).
#
# ВАЖНО: единственное место поставки, где допустимы абсолютные пути (T-13).
# ============================================================================

# --- 7.1 Пути ---------------------------------------------------------------

# Каталог .bsp-карт сервера (для автогенерации подложек)
QW_MAP_DIR="/opt/quake/server/id1/maps"

# Каталог MVD-демок
DEMO_DIR="/opt/quake/server/ffa/demos"

# demoinfo текущего сервера (mvdsv перезаписывает его после каждой партии).
# Может быть перекрыт первым аргументом heatmap.sh (для ручных тестов).
DEMOINFO_FILE="/opt/quake/server/ffa/demoinfo_127.0.1.1_27501.json"

# Подложки <map>.bmp и mapinfo <map>.json (генерируются автоматически при отсутствии)
BLANK_MAP_DIR="${SCRIPT_DIR}/blank_map"

# Каталог результатов партий
RESULT_DIR="${SCRIPT_DIR}/result"

# Каталог логов
LOG_DIR="${SCRIPT_DIR}/logs"

# База run-каталогов и lock-файла
TMP_BASE="${SCRIPT_DIR}/tmp"

# Бинарники и данные (не изменяются). Бинарники поставки — в tools/;
# при старой раскладке (файлы в корне рядом со скриптом) можно оставить старые
# пути или закомментировать эти строки — скрипт сам найдёт бинарник.
MVDPARSER_BIN="${SCRIPT_DIR}/tools/mvdparser"
FRAGFILE="${SCRIPT_DIR}/fragfile.dat"
TEMPLATE_TPL="${SCRIPT_DIR}/template.tpl"
GNUPLOT_SCRIPT="${SCRIPT_DIR}/xy.gnuplot"
BSP2BMP_BIN="${SCRIPT_DIR}/tools/bsp2bmp_3800"

# Аргументы рендера подложки (масштаб 4, проекция +Z сверху)
BSP2BMP_ARGS="-s4 -z0 -p0 -e -c+Z"

# Файл блокировки от параллельного запуска
LOCK_FILE="${TMP_BASE}/heatmap.lock"

# --- 7.2 Нарезка и анимация --------------------------------------------------

# Число кадров GIF: кадр f содержит каждый NUM-й замер партии (interleave, 8.2).
# Если строк данных у игрока меньше — число кадров сокращается до числа строк.
MAX_FRAMES=20

# Минимум строк в .data, чтобы игрок обрабатывался
MIN_DATA_LINES=10

# Задержка кадра для convert -delay (сотые секунды; 5 = 50 мс = 20 fps)
GIF_DELAY_CS=5

# Число повторов GIF (0 — бесконечно)
GIF_LOOP=0

# Процент -fuzz для mogrify -layers optimize
GIF_OPTIMIZE_FUZZ=10

# --- 7.3 Отрисовка: палитра, маркеры, фон подложки ----------------------------

# Цвет нижней границы шкалы высоты (MIN_Z) — gnuplot-цвет
PALETTE_MIN_COLOR="blue"

# Цвет верхней границы шкалы высоты (MAX_Z) — gnuplot-цвет
PALETTE_MAX_COLOR="red"

# Полное выражение палитры gnuplot (БЕЗ слов "set palette").
# Если непусто — подставляется дословно и ПЕРЕКРЫВАЕТ пару MIN/MAX цветов.
# ВНИМАНИЕ: позиции внутри defined(...) нормируются по диапазону ВСЕЙ таблицы,
# а не по cbrange — буквальная "0.5" между MIN_Z и MAX_Z ляжет у самого низа
# шкалы. Рабочие примеры (проверены на gnuplot 5.4):
#   PALETTE_CUSTOM='defined (0 "blue", 0.25 "cyan", 0.5 "green", 0.75 "yellow", 1 "red")'
#   PALETTE_CUSTOM='defined (MIN_Z "blue", (MIN_Z+MAX_Z)/2 "green", MAX_Z "red")'  # зелёный ровно в середине любой шкалы
#   PALETTE_CUSTOM='rgbformulae 33,13,10'
#   PALETTE_CUSTOM='gray'
PALETTE_CUSTOM=""

# «Фигурка» маркера движения — gnuplot pointtype (целое 1..15; 5 = ■ заливка)
MARKER_MOVE_TYPE=5

# «Фигурка» маркера смерти — pointtype (целое 1..15; 2 = ×)
MARKER_DEATH_TYPE=2

# Размер маркера: размер точки = MIN_MARKER_SIZE + t*(MAX_MARKER_SIZE-
# MIN_MARKER_SIZE), где t=(z-MIN_Z)/(MAX_Z-MIN_Z) — «чем выше, тем крупнее».
# Числа > 0, MIN <= MAX.
MIN_MARKER_SIZE=0.7
MAX_MARKER_SIZE=1.5

# Инвертировать цвета свежесгенерированной подложки (mogrify -negate):
# нативный фон bsp2bmp — ЧЁРНЫЙ; при true он становится белым.
# Применяется только при генерации bmp.
BLANK_MAP_NEGATE=true

# Минимальное число повторов значения Z (любого знака), чтобы оно
# участвовало в MIN_Z/MAX_Z (фильтр выбросов, 8.4)
Z_OUTLIER_MIN_COUNT=10

# Значение padding для генератора mapinfo
MAPINFO_PADDING=10

# Значение scaling для генератора mapinfo (должно соответствовать -s4 в BSP2BMP_ARGS)
MAPINFO_SCALING=4

# --- 7.4 Ретеншн и поведение --------------------------------------------------

# Удалить каталоги результата старше N суток
RETENTION_MAX_AGE_DAYS=90

# Держать не более N каталогов результата (лишние — старейшие)
RETENTION_MAX_DIRS=200

# Удалить логи старше N суток
LOG_RETENTION_DAYS=30

# Сколько секунд ждать освобождения лока (таймаут — код возврата 4)
LOCK_WAIT_SEC=1800

# Сохранять run-каталог при ошибке (для разбора). Пустой каталог (сбой до
# парсинга) удаляется всегда — в tmp не копятся пустые папки.
KEEP_TMP_ON_FAIL=true

# Класть копию demoinfo.json в каталог результата (провенанс партии).
# false — в result только GIF-файлы.
RESULT_COPY_DEMOINFO=false

# Nice для скрипта (не отнимать CPU у игрового сервера); пусто — не применять
NICE_LEVEL=10
